# v1.16 (limecore#15, SUPPLY-03): the workflows pin every action to a full
# commit SHA, so a moved or hijacked tag cannot change what CI runs. This keeps
# those pins current: Dependabot opens a PR when an action releases, and the
# `# vX.Y.Z` comment next to each SHA is what it updates alongside it.
# npm and Gradle below are security updates only; version upgrades are
# planned by hand (majors were v1.18).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # v1.17 (limecore#42): without this, PRs target the default branch, `main`,
    # which takes release merges only. Read from `main`, so it applies once a
    # release carries it there.
    target-branch: develop
    schedule:
      interval: monthly

  # v1.22 (limecore#98): npm and Gradle too, so a published advisory in a
  # shipped dependency (Capacitor, Electron, ...) raises a security PR instead
  # of going unnoticed until the next manual audit. Version bumps stay planned
  # by hand: `open-pull-requests-limit: 0` turns routine version-update PRs off,
  # while security updates (which the owner enables in the repo's Security
  # settings, together with Dependabot alerts) still use this entry.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /android
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
